name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify manifest.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Check required manifest fields
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('manifest.json','utf8'));
            if (m.manifest_version !== 3) throw new Error('manifest_version must be 3');
            if (!/^\d+\.\d+\.\d+/.test(m.version || '')) throw new Error('missing or invalid version');
            if (!m.theme?.colors?.frame) throw new Error('theme.colors.frame is required');
            console.log('Required fields OK — v' + m.version);
          "

      - name: Package dry-run
        run: npm run package:dry
