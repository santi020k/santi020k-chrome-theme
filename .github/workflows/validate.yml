name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify manifest.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Check required manifest fields and version sync
        run: npm run package:dry

      - name: NTP background image present
        run: test -f images/theme_ntp_background.webp
